services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "ecommerce"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "1234"
      TZ: "Asia/Seoul"

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p1234",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama_data:/root/.ollama

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://ollama:11434"

      DB_USER: "appuser"
      DB_PASSWORD: "1234"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "ecommerce"

    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started

  reactjs:
    build:
      context: .
      dockerfile: Dockerfile.react

    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:5173"

    environment:
      VITE_API_URL: "http://127.0.0.1:8000"

    depends_on:
      - fastapi

volumes:
  mysql_data:
  qdrant_data:
  ollama_data:
